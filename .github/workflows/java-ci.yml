
name: Java Spring Boot CI

on:
  push:
    branches:
      - main
    paths:
      - "java-orders-app/**"
      - ".github/workflows/java-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "java-orders-app/**"
      - ".github/workflows/java-ci.yml"

permissions:
  contents: read
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test with Maven
        working-directory: java-orders-app
        run: mvn --batch-mode clean verify

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::559401928438:role/github-actions-ecr-role
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      -
      - name: Build Docker image
        working-directory: java-orders-app
        run: docker build -t java-orders-app:${{ github.sha }} .

      - name: Tag Docker image for ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag java-orders-app:${{ github.sha }} 559401928438.dkr.ecr.us-east-1.amazonaws.com/devops-platform:${{ github.sha }}

      - name: Push Docker image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push 559401928438.dkr.ecr.us-east-1.amazonaws.com/devops-platform:${{ github.sha }}
